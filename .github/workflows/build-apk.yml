name: Build Android APK

on:
  push:
    branches:
      - capacitor-android
  pull_request:
    branches:
      - capacitor-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Install dependencies
      run: |
        cd campusbudget-pro
        npm install
    
    - name: Build React app
      run: |
        cd campusbudget-pro
        npm run build
    
    - name: Add Android platform
      run: |
        cd campusbudget-pro
        npx cap add android
      continue-on-error: true
    
    - name: Copy web assets
      run: |
        cd campusbudget-pro
        npx cap copy android
    
    - name: Build Debug APK
      run: |
        cd campusbudget-pro/android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v3
      with:
        name: Campus-Budget-Pro-Debug
        path: campusbudget-pro/android/app/build/outputs/apk/debug/app-debug.apk
